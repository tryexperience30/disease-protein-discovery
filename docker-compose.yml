# Local research stack: FastAPI + Next.js.
# Browser talks to http://localhost:8000 (published backend port).
# Next.js server-side requests use API_INTERNAL_URL=http://backend:8000.
#
# Static export (same scientific environment as FastAPI):
#   docker compose run --rm backend python /app/scripts/export_static_data.py
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./frontend/public/generated:/app/frontend/public/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
